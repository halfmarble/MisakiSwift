name: Probe
on: [workflow_dispatch, push]
jobs:
  probe15:
    runs-on: macos-15
    steps:
      - run: |
          echo "=== runner: macos-15 ==="
          sw_vers
          ls -d /Applications/Xcode*.app
          for x in /Applications/Xcode*.app; do
            echo "--- $x"; "$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -2
            "$x/Contents/Developer/usr/bin/swift" --version 2>/dev/null | head -1
          done
  probe26:
    runs-on: macos-26
    steps:
      - run: |
          echo "=== runner: macos-26 ==="
          sw_vers
          ls -d /Applications/Xcode*.app
          xcodebuild -version; swift --version
